<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#12141D"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F5B700" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#F5B700" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5B700"/>
      <stop offset="100%" stop-color="#B47B00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <rect width="1200" height="750" fill="url(#glow1)"/>
  <!-- Perspective Tactical Grid -->
  <g stroke="#27272A" stroke-width="1" opacity="0.6">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="600" y1="360" x2="100" y2="750"/>
    <line x1="600" y1="360" x2="350" y2="750"/>
    <line x1="600" y1="360" x2="600" y2="750"/>
    <line x1="600" y1="360" x2="850" y2="750"/>
    <line x1="600" y1="360" x2="1100" y2="750"/>
  </g>
  <!-- Sci-Fi Monoliths & Unity 6 Volumetric Lighting -->
  <polygon points="240,520 310,190 380,220 360,520" fill="#161822" stroke="#3F3F46" stroke-width="1.5"/>
  <polygon points="840,520 820,220 890,190 960,520" fill="#161822" stroke="#3F3F46" stroke-width="1.5"/>
  <!-- Central Geometric Hornet Mecha Core -->
  <g transform="translate(600, 340)">
    <polygon points="0,-165 140,-80 140,80 0,165 -140,80 -140,-80" fill="#0D0E14" stroke="#F5B700" stroke-width="2" stroke-opacity="0.45"/>
    <polygon points="0,-125 190,-35 95,25 0,-30 -95,25 -190,-35" fill="url(#gold1)" opacity="0.92"/>
    <polygon points="-75,30 0,-5 75,30 50,95 0,120 -50,95" fill="#FAFAFA"/>
    <polygon points="-40,115 0,138 40,115 0,195" fill="url(#gold1)"/>
    <circle cx="0" cy="45" r="14" fill="#070709"/>
    <circle cx="0" cy="45" r="6" fill="#F5B700"/>
  </g>
  <!-- Tactical HUD Frame Corners -->
  <path d="M70 110 V70 H110" stroke="#F5B700" stroke-width="2"/>
  <path d="M1130 110 V70 H1090" stroke="#F5B700" stroke-width="2"/>
  <path d="M70 640 V680 H110" stroke="#F5B700" stroke-width="2"/>
  <path d="M1130 640 V680 H1090" stroke="#F5B700" stroke-width="2"/>
  <text x="95" y="102" fill="#A1A1AA" font-family="monospace" font-size="15" letter-spacing="2">UNITY 6 · HDRP · PROTOTYPE SCENE</text>
  <text x="95" y="660" fill="#FAFAFA" font-family="sans-serif" font-weight="700" font-size="24">SECTOR VESPULA: TACTICAL ARENA</text>
</svg>
